<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Anemic domain model versus Rich Domain Model</title>
  <desc id="description">Left: an anemic Order holds only public setters, business rules are scattered across services and handlers, so validation gets missed and invalid state is stored. Right: Order.Create checks the invariant and returns Result of Order, either Success with a valid Order or Failure with an error, and state changes only through domain behavior methods.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0b1120" /><stop offset="100%" stop-color="#0f172a" /></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="1" /></pattern>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0 0L14 7L0 14z" fill="#93c5fd" /></marker>
    <marker id="arrow-s" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#6ee7b7" /></marker>
    <marker id="arrow-f" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#fca5a5" /></marker>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <text x="130" y="112" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="38" font-weight="700" fill="#f8fafc">빈혈 모델에서 Rich Domain Model로</text>

  <rect x="130" y="160" width="390" height="320" rx="18" fill="#111827" stroke="#f87171" stroke-width="2.5" />
  <text x="152" y="192" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="700" fill="#fca5a5">빈혈 도메인 모델</text>
  <rect x="152" y="214" width="346" height="66" rx="8" fill="#7f1d1d" fill-opacity="0.6" stroke="#f87171" stroke-width="1.8" />
  <text x="325" y="244" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="20" fill="#e2e8f0" text-anchor="middle">Order = 공개 setter만 있는</text>
  <text x="325" y="268" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="20" fill="#e2e8f0" text-anchor="middle">데이터 덩어리</text>
  <rect x="152" y="300" width="346" height="66" rx="8" fill="#7f1d1d" fill-opacity="0.6" stroke="#f87171" stroke-width="1.8" />
  <text x="325" y="330" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="20" fill="#e2e8f0" text-anchor="middle">규칙은 서비스·핸들러에</text>
  <text x="325" y="354" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="20" fill="#e2e8f0" text-anchor="middle">흩어져 있음</text>
  <rect x="152" y="386" width="346" height="66" rx="8" fill="#451a03" fill-opacity="0.7" stroke="#f59e0b" stroke-width="1.8" />
  <text x="325" y="416" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="20" fill="#fbbf24" text-anchor="middle">불변식 검증 누락</text>
  <text x="325" y="440" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="20" fill="#fbbf24" text-anchor="middle">→ 잘못된 상태가 저장됨</text>

  <path d="M542 320H638" stroke="#93c5fd" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)" />
  <text x="590" y="290" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="20" font-weight="700" fill="#e2e8f0" text-anchor="middle">전환</text>

  <rect x="660" y="160" width="410" height="320" rx="18" fill="#111827" stroke="#34d399" stroke-width="2.5" />
  <text x="682" y="192" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="700" fill="#6ee7b7">Rich Domain Model</text>
  <rect x="682" y="214" width="366" height="46" rx="8" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.8" />
  <text x="865" y="244" font-family="Consolas, 'Courier New', monospace" font-size="20" fill="#e2e8f0" text-anchor="middle">Order.Create(customerId)</text>
  <path d="M865 262V286" stroke="#6ee7b7" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-s)" />
  <rect x="682" y="288" width="366" height="46" rx="8" fill="#065f46" stroke="#34d399" stroke-width="1.8" />
  <text x="865" y="318" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="20" fill="#e2e8f0" text-anchor="middle">불변식 검사: 고객 ID 유효?</text>
  <path d="M770 334V356" stroke="#6ee7b7" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-s)" />
  <path d="M960 334V356" stroke="#fca5a5" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-f)" />
  <rect x="682" y="358" width="176" height="64" rx="8" fill="#14532d" fill-opacity="0.8" stroke="#4ade80" stroke-width="1.8" />
  <text x="770" y="386" font-family="Consolas, 'Courier New', monospace" font-size="20" font-weight="700" fill="#bbf7d0" text-anchor="middle">Success</text>
  <text x="770" y="410" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="17" fill="#bbf7d0" text-anchor="middle">유효한 Order</text>
  <rect x="872" y="358" width="176" height="64" rx="8" fill="#7f1d1d" fill-opacity="0.7" stroke="#f87171" stroke-width="1.8" />
  <text x="960" y="386" font-family="Consolas, 'Courier New', monospace" font-size="20" font-weight="700" fill="#fecaca" text-anchor="middle">Failure</text>
  <text x="960" y="410" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="17" fill="#fecaca" text-anchor="middle">OrderErrors 반환</text>
  <text x="865" y="454" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="18" fill="#a7f3d0" text-anchor="middle">private set: 행위 메서드로만 상태 변경</text>

  <text x="130" y="540" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#cbd5e1">핵심: 항상 유효한 엔티티 · 실패는 throw 대신 Result&lt;T&gt;</text>
</svg>
