<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Peony monorepo split into fifteen service repositories</title>
  <desc id="description">Left: one monorepo holding fifteen services. Right: fifteen separate service repositories created on November 1 between 11:52 and 18:36, plus the Contract and Aspire repositories added afterwards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0b1120" /><stop offset="100%" stop-color="#0f172a" /></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="1" /></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#93c5fd" /></marker>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <text x="130" y="112" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="38" font-weight="700" fill="#f8fafc">서비스 15개, 저장소 1개에서 15개로</text>
  <!-- 왼쪽: 서비스 15개가 들어 있는 모노레포 하나 -->
  <rect x="130" y="160" width="300" height="320" rx="18" fill="#111827" stroke="#3b82f6" stroke-width="2.5" />
  <text x="152" y="192" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="700" fill="#93c5fd">Peony 모노레포</text>
  <rect x="172" y="215" width="56" height="36" rx="6" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5" />
  <rect x="252" y="215" width="56" height="36" rx="6" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5" />
  <rect x="332" y="215" width="56" height="36" rx="6" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5" />
  <rect x="172" y="265" width="56" height="36" rx="6" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5" />
  <rect x="252" y="265" width="56" height="36" rx="6" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5" />
  <rect x="332" y="265" width="56" height="36" rx="6" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5" />
  <rect x="172" y="315" width="56" height="36" rx="6" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5" />
  <rect x="252" y="315" width="56" height="36" rx="6" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5" />
  <rect x="332" y="315" width="56" height="36" rx="6" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5" />
  <rect x="172" y="365" width="56" height="36" rx="6" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5" />
  <rect x="252" y="365" width="56" height="36" rx="6" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5" />
  <rect x="332" y="365" width="56" height="36" rx="6" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5" />
  <rect x="172" y="415" width="56" height="36" rx="6" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5" />
  <rect x="252" y="415" width="56" height="36" rx="6" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5" />
  <rect x="332" y="415" width="56" height="36" rx="6" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5" />
  <!-- 가운데: 11월 1일 하루 -->
  <path d="M452 320H556" stroke="#93c5fd" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)" />
  <text x="504" y="288" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="700" fill="#e2e8f0" text-anchor="middle">11/01</text>
  <text x="504" y="362" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="18" fill="#94a3b8" text-anchor="middle">11:52~18:36</text>
  <!-- 오른쪽: 서비스마다 독립 저장소 15개 -->
  <rect x="582" y="190" width="80" height="60" rx="8" fill="#064e3b" fill-opacity="0.6" stroke="#34d399" stroke-width="2" />
  <rect x="684" y="190" width="80" height="60" rx="8" fill="#064e3b" fill-opacity="0.6" stroke="#34d399" stroke-width="2" />
  <rect x="786" y="190" width="80" height="60" rx="8" fill="#064e3b" fill-opacity="0.6" stroke="#34d399" stroke-width="2" />
  <rect x="888" y="190" width="80" height="60" rx="8" fill="#064e3b" fill-opacity="0.6" stroke="#34d399" stroke-width="2" />
  <rect x="990" y="190" width="80" height="60" rx="8" fill="#064e3b" fill-opacity="0.6" stroke="#34d399" stroke-width="2" />
  <rect x="582" y="272" width="80" height="60" rx="8" fill="#064e3b" fill-opacity="0.6" stroke="#34d399" stroke-width="2" />
  <rect x="684" y="272" width="80" height="60" rx="8" fill="#064e3b" fill-opacity="0.6" stroke="#34d399" stroke-width="2" />
  <rect x="786" y="272" width="80" height="60" rx="8" fill="#064e3b" fill-opacity="0.6" stroke="#34d399" stroke-width="2" />
  <rect x="888" y="272" width="80" height="60" rx="8" fill="#064e3b" fill-opacity="0.6" stroke="#34d399" stroke-width="2" />
  <rect x="990" y="272" width="80" height="60" rx="8" fill="#064e3b" fill-opacity="0.6" stroke="#34d399" stroke-width="2" />
  <rect x="582" y="354" width="80" height="60" rx="8" fill="#064e3b" fill-opacity="0.6" stroke="#34d399" stroke-width="2" />
  <rect x="684" y="354" width="80" height="60" rx="8" fill="#064e3b" fill-opacity="0.6" stroke="#34d399" stroke-width="2" />
  <rect x="786" y="354" width="80" height="60" rx="8" fill="#064e3b" fill-opacity="0.6" stroke="#34d399" stroke-width="2" />
  <rect x="888" y="354" width="80" height="60" rx="8" fill="#064e3b" fill-opacity="0.6" stroke="#34d399" stroke-width="2" />
  <rect x="990" y="354" width="80" height="60" rx="8" fill="#064e3b" fill-opacity="0.6" stroke="#34d399" stroke-width="2" />
  <text x="582" y="170" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="700" fill="#6ee7b7">서비스별 독립 저장소 15개</text>
  <!-- 이틀째 이후: Contract, Aspire -->
  <rect x="582" y="440" width="80" height="60" rx="8" fill="#451a03" fill-opacity="0.5" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4" />
  <rect x="684" y="440" width="80" height="60" rx="8" fill="#451a03" fill-opacity="0.5" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4" />
  <text x="786" y="476" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="20" fill="#fbbf24">+ Contract · Aspire</text>
  <text x="130" y="548" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#cbd5e1">하루에 소스를 옮기고, 계약 소유권은 이틀째에 정리했다</text>
</svg>
