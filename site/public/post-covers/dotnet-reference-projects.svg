<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Microsoft .NET core repositories and the sample repositories that support them</title>
  <desc id="description">Left: dotnet/eShop, a complete app. Right: core repositories each paired with the sample repositories that support them. dotnet/aspnetcore with blazor-samples and AspNetCore.Docs.Samples, dotnet/maui with maui-samples, microsoft/aspire with aspire-samples, dotnet/runtime with dotnet/samples.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0b1120" /><stop offset="100%" stop-color="#0f172a" /></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="1" /></pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <g transform="translate(84 66) scale(0.86)">
    <text x="60" y="100" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="40" font-weight="700" fill="#f8fafc">Microsoft .NET 레퍼런스 저장소</text>
    <rect x="60" y="140" width="300" height="370" rx="18" fill="#064e3b" fill-opacity="0.45" stroke="#34d399" stroke-width="2.5" />
    <text x="86" y="182" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="26" font-weight="700" fill="#6ee7b7">완성된 앱</text>
    <rect x="86" y="206" width="248" height="64" rx="8" fill="#065f46" stroke="#34d399" stroke-width="1.6" />
    <text x="106" y="246" font-family="'Cascadia Code', Consolas, monospace" font-size="22" fill="#e2e8f0">dotnet/eShop</text>
    <rect x="390" y="140" width="740" height="370" rx="18" fill="#1e3a8a" fill-opacity="0.35" stroke="#60a5fa" stroke-width="2.5" />
    <text x="416" y="182" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="26" font-weight="700" fill="#93c5fd">핵심 저장소와 보조하는 샘플</text>
    <rect x="416" y="206" width="688" height="64" rx="8" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.6" />
    <text x="436" y="246" font-family="'Cascadia Code', Consolas, monospace" font-size="22" fill="#e2e8f0">dotnet/aspnetcore</text>
    <text x="1084" y="246" font-family="'Cascadia Code', Consolas, monospace" font-size="18" fill="#a5b4fc" text-anchor="end">blazor-samples · Docs.Samples</text>
    <rect x="416" y="282" width="688" height="64" rx="8" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.6" />
    <text x="436" y="322" font-family="'Cascadia Code', Consolas, monospace" font-size="22" fill="#e2e8f0">dotnet/maui</text>
    <text x="1084" y="322" font-family="'Cascadia Code', Consolas, monospace" font-size="18" fill="#a5b4fc" text-anchor="end">maui-samples</text>
    <rect x="416" y="358" width="688" height="64" rx="8" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.6" />
    <text x="436" y="398" font-family="'Cascadia Code', Consolas, monospace" font-size="22" fill="#e2e8f0">microsoft/aspire</text>
    <text x="1084" y="398" font-family="'Cascadia Code', Consolas, monospace" font-size="18" fill="#a5b4fc" text-anchor="end">aspire-samples</text>
    <rect x="416" y="434" width="688" height="64" rx="8" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.6" />
    <text x="436" y="474" font-family="'Cascadia Code', Consolas, monospace" font-size="22" fill="#e2e8f0">dotnet/runtime</text>
    <text x="1084" y="474" font-family="'Cascadia Code', Consolas, monospace" font-size="18" fill="#a5b4fc" text-anchor="end">dotnet/samples</text>
  </g>
</svg>
